# steam-stream: single-container Moonlight host
services:
  steam-stream:
    image: local/steam-stream:latest
    container_name: steam-stream
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    gpus: all
    devices:
      - /dev/uinput:/dev/uinput
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - "c 13:* rmw"     # input
      - "c 189:* rmw"    # usb_device
      # hidraw's major is allocated at boot; check `grep hidraw /proc/devices` if it EPERMs.
      - "c 243:* rmw"    # hidraw

    environment:
      STEAM_STREAM_RENDER_NODE: /dev/dri/renderD129
      WOLF_USE_ZERO_COPY: "TRUE"
    shm_size: "2gb"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
      - SYS_PTRACE
      - NET_RAW
      - MKNOD
      - NET_ADMIN

    volumes:
      - /opt/steam-stream/home:/home/retro
      - /opt/steam-stream/state:/var/lib/steam-stream
      - ./config:/config
      - /dev/input:/dev/input
      # Separate path so the container's own /run/udev/data stays private to fake_udev.
      - /run/udev/data:/run/host-udev/data:ro
      - /mnt/games:/mnt/games
      - /mnt/nas_roms:/mnt/nas_roms
